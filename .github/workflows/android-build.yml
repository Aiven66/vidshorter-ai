name: Build Android APK

# Builds the Android client (apps/android-agent) and uploads the resulting
# APK to a GitHub Release tagged "android-0.9.30".
#
# Triggers:
#   - Manual dispatch (workflow_dispatch)
#   - Push to apps/android-agent/** on main
#   - Nightly build at 04:00 UTC

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload APK to (e.g. android-0.9.30)'
        required: false
        default: 'android-0.9.30'
  push:
    branches:
      - main
    paths:
      - 'apps/android-agent/**'
      - '.github/workflows/android-build.yml'
  schedule:
    # Nightly build at 04:00 UTC — keeps release APK fresh
    - cron: '0 4 * * *'

permissions:
  contents: write   # required to create GitHub Releases & upload assets

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    env:
      # Sign the release APK with the debug keystore by default.
      # When SIGNING_KEYSTORE_FILE is unset, app/build.gradle.kts falls back
      # to the debug signingConfig which produces a debug-signed release APK
      # (installable on real devices via "Install unknown apps" permission).
      SIGNING_KEYSTORE_FILE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_FILE }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          set -e
          echo "Installing platforms;android-34 and build-tools;34.0.0..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK ready. ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Generate Gradle wrapper jar (not committed)
        working-directory: apps/android-agent
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make gradlew executable
        working-directory: apps/android-agent
        run: chmod +x ./gradlew

      - name: Decode release keystore (if provided)
        if: env.SIGNING_KEYSTORE_FILE != ''
        working-directory: apps/android-agent
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "SIGNING_KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV

      - name: Build release APK
        working-directory: apps/android-agent
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Dump build error to step summary on failure
        if: failure()
        working-directory: apps/android-agent
        run: |
          echo "## Build Failure Log (last 200 lines)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no build.log found)"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log as artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: apps/android-agent/build.log
          retention-days: 7

      - name: Locate built APK
        id: locate-apk
        working-directory: apps/android-agent
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found in app/build/outputs/apk/release/"
            ls -la app/build/outputs/apk/ 2>/dev/null || true
            exit 1
          fi
          APK_ABS=$(cd "$(dirname "$APK_PATH")" && pwd)/$(basename "$APK_PATH")
          echo "APK_PATH=$APK_ABS" >> $GITHUB_ENV
          VERSION_NAME=$(grep -E '^\s*versionName' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          echo "APK_NAME=clipop-agent-${VERSION_NAME}-android.apk" >> $GITHUB_ENV
          ls -la "$APK_ABS"

      - name: Rename APK to a friendly name
        run: |
          cp "$APK_PATH" "$APK_NAME"
          ls -la "$APK_NAME"

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG=android-0.9.30" >> $GITHUB_ENV
          fi

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Clipop Agent for Android ${{ env.TAG }}"
          body: |
            # Clipop Agent for Android

            Built from commit ${{ github.sha }} on ${{ github.event_name }}.

            ## Installation
            1. Download the APK file below.
            2. On your Android device, open Settings → Security → enable "Install unknown apps" for your browser.
            3. Tap the downloaded APK to install.
            4. Open "Clipop Agent" and sign in with your existing web account.
            5. Your credits, history, and subscriptions sync automatically.
          files: ${{ env.APK_NAME }}
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipop-agent-android-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30
