name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Find correct Vercel project ID
        id: find-project
        run: |
          set -e
          # Find the "clipopai" project ID via Vercel API
          echo "Finding 'clipopai' project ID..."
          PROJECTS_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects?teamId=${{ secrets.VERCEL_ORG_ID }}&limit=100")

          echo "API Response (first 500 chars):"
          echo "$PROJECTS_JSON" | head -c 500
          echo ""

          # Try to find project named "clipopai"
          CLIPOPAI_PROJECT_ID=$(echo "$PROJECTS_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for project in data.get('projects', []):
              if project.get('name') == 'clipopai':
                  print(project.get('id'))
                  break
          " 2>/dev/null || true)

          if [ -z "$CLIPOPAI_PROJECT_ID" ]; then
            echo "WARNING: 'clipopai' project not found in team. Listing all projects:"
            echo "$PROJECTS_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for project in data.get('projects', []):
              print(f\"  - {project.get('name')}: {project.get('id')}\")
          " 2>/dev/null || echo "Failed to parse projects JSON"

            # Fall back to the configured VERCEL_PROJECT_ID
            echo "Falling back to VERCEL_PROJECT_ID from secrets"
            CLIPOPAI_PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}"
          else
            echo "SUCCESS: Found 'clipopai' project with ID: $CLIPOPAI_PROJECT_ID"
          fi

          # Export the correct project ID for the deploy step
          echo "CLIPOPAI_PROJECT_ID=$CLIPOPAI_PROJECT_ID" >> $GITHUB_ENV
          echo "Final CLIPOPAI_PROJECT_ID: $CLIPOPAI_PROJECT_ID"

      - name: Deploy to Vercel
        run: |
          set -e
          npm install -g vercel@latest
          # Use the correct project ID directly via env var
          echo "Deploying with project ID: $CLIPOPAI_PROJECT_ID"
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --debug 2>&1 | tee deploy.log
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.CLIPOPAI_PROJECT_ID }}
