name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Find correct Vercel project ID
        id: find-project
        run: |
          set -e
          echo "Finding 'clipopai' project ID..."
          PROJECTS_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects?teamId=${{ secrets.VERCEL_ORG_ID }}&limit=100")

          # Check for API errors
          API_ERROR=$(echo "$PROJECTS_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if 'error' in data:
              print(f\"API Error: {data.get('error', {}).get('message', 'unknown')}\")
          elif 'projects' not in data:
              print(f\"Unexpected response: {str(data)[:200]}\")
          " 2>&1 || echo "Failed to parse response")

          if [ -n "$API_ERROR" ]; then
            echo "ERROR: Vercel API returned an error:"
            echo "$API_ERROR"
            echo ""
            echo "Full API response:"
            echo "$PROJECTS_JSON" | head -c 1000
            exit 1
          fi

          echo "All projects in team:"
          echo "$PROJECTS_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for project in data.get('projects', []):
              print(f\"  - {project.get('name')}: {project.get('id')}\")
          "

          # Find project named "clipopai"
          CLIPOPAI_PROJECT_ID=$(echo "$PROJECTS_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for project in data.get('projects', []):
              if project.get('name') == 'clipopai':
                  print(project.get('id'))
                  break
          ")

          if [ -z "$CLIPOPAI_PROJECT_ID" ]; then
            echo "ERROR: 'clipopai' project not found in team!"
            echo "The deployment CANNOT proceed because the 'clipopai' project was not found."
            echo "Please check the Vercel dashboard to verify the project exists and is in the correct team."
            exit 1
          fi

          echo "SUCCESS: Found 'clipopai' project with ID: $CLIPOPAI_PROJECT_ID"
          echo "CLIPOPAI_PROJECT_ID=$CLIPOPAI_PROJECT_ID" >> $GITHUB_ENV

      - name: Deploy to Vercel
        run: |
          set -e
          npm install -g vercel@latest
          echo "Deploying with project ID: $CLIPOPAI_PROJECT_ID"
          # Deploy with --force to disable build cache and ensure fresh build
          vercel deploy --prod --force --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | tee deploy.log

          # Extract the production URL from the output
          PROD_URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' deploy.log | head -1 || true)
          echo "Production URL: $PROD_URL"
          echo "PROD_URL=$PROD_URL" >> $GITHUB_ENV

          # Verify the deployment is NOT the 'projects' project
          if echo "$PROD_URL" | grep -q "projects-"; then
            echo "ERROR: Deployed to the wrong project (projects-)! Expected clipopai."
            exit 1
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.CLIPOPAI_PROJECT_ID }}

      - name: Verify deployment
        run: |
          set -e
          echo "Waiting 10s for deployment to propagate..."
          sleep 10

          echo "Checking production URL for version marker..."
          HTML=$(curl -s "https://www.clipopai.com/?_=$(date +%s)")
          if echo "$HTML" | grep -q "data-build-version"; then
            VERSION=$(echo "$HTML" | grep -oE 'data-build-version="[^"]*"' | head -1)
            echo "SUCCESS: Found version marker: $VERSION"
          else
            echo "WARNING: Version marker not found in HTML. CDN cache might not have updated yet."
            echo "Trying clipopai.vercel.app directly..."
            HTML2=$(curl -s "https://clipopai.vercel.app/?_=$(date +%s)")
            if echo "$HTML2" | grep -q "data-build-version"; then
              VERSION=$(echo "$HTML2" | grep -oE 'data-build-version="[^"]*"' | head -1)
              echo "SUCCESS: Found version marker on clipopai.vercel.app: $VERSION"
            else
              echo "ERROR: Version marker not found. The deployment might not have the latest code."
              exit 1
            fi
          fi
